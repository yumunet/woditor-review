[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".reference", ".tools", "dist", "public/pyodide"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# Keep the pinned Ruff defaults and the project's existing additional checks.
extend-select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
